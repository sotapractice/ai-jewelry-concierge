<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Jewelry Concierge</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f7f7f7;color:#222}
header{background:#111;color:#fff;padding:22px 18px;text-align:center}
header h1{font-size:20px;letter-spacing:1.5px;margin:0 0 6px}
header p{font-size:12px;margin:0;color:#ccc}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ai-label{font-size:12px;font-weight:700;color:#777;margin-bottom:8px}
.searchbox{display:flex;gap:8px}
textarea{width:100%;min-height:82px;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:15px;resize:none}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer}
.searchbtn{background:#111;color:#fff;white-space:nowrap;align-self:flex-end}
.example{font-size:12px;color:#777;margin-top:9px;line-height:1.6}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{background:#f0f0f0;padding:8px 10px;border-radius:999px;font-size:12px}
.analysis{display:none}
.analysis.show{display:block}
.loader{font-size:13px;color:#666}
.result{border:1px solid #e5e5e5;border-radius:14px;padding:14px;margin-top:12px}
.result h3{margin:0 0 7px;font-size:16px}
.meta{font-size:12px;color:#666;margin-bottom:8px}
.match{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;margin-bottom:9px}
.reason{font-size:13px;line-height:1.65}
.tag{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:4px 8px;font-size:11px;margin:4px 3px 0 0}
.reset{background:#eee;color:#333;margin-top:14px;width:100%}
.note{font-size:11px;color:#888;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>AI JEWELRY CONCIERGE</h1>
  <p>AIに相談して、あなたに合うジュエリーを検索</p>
</header>

<main class="wrap">
  <section class="card">
    <div class="ai-label">AI SEARCH</div>
    <h2 style="font-size:18px;margin:0 0 8px">どんなジュエリーをお探しですか？</h2>
    <p style="font-size:13px;color:#666;line-height:1.6;margin:0 0 12px">
      普段使い・デザイン・予算・プレゼントなど、自然な文章で入力してください。
    </p>

    <textarea id="query" placeholder="例：普段使いできるシンプルなネックレスが欲しい。予算は2万円くらい"></textarea>
    <div class="searchbox">
      <div style="flex:1"></div>
      <button class="searchbtn" onclick="searchJewelry()">AI検索</button>
    </div>

    <div class="example">入力例</div>
    <div class="chips">
      <button class="chip" onclick="setExample('普段使いできるシンプルなネックレス。予算は2万円くらい')">普段使い・シンプル</button>
      <button class="chip" onclick="setExample('プレゼント用で、上品で華やかなアクセサリー。3万円以内')">プレゼント・上品</button>
      <button class="chip" onclick="setExample('カジュアルな服に合わせやすいアクセサリー。1万円くらい')">カジュアル・1万円</button>
    </div>
  </section>

  <section class="card analysis" id="analysis">
    <div class="ai-label">AI ANALYSIS</div>
    <div id="analysisText" class="loader">入力内容を分析しています...</div>
  </section>

  <section class="card analysis" id="results">
    <div class="ai-label">SEARCH RESULTS</div>
    <h2 style="font-size:18px;margin:0">AIおすすめ商品</h2>
    <div id="resultList"></div>
    <button class="reset" onclick="resetSearch()">条件をリセット</button>
  </section>

  <section class="card">
    <div class="note">
      ※これは店舗でのAI活用を想定したシステム提案デモです。商品情報・価格はサンプルです。<br>
      実運用では店舗の商品データと連携し、在庫状況や最新の商品情報を反映できます。
    </div>
  </section>
</main>

<script>
const products=[
 {name:"シンプル ストーンネックレス",type:"ネックレス",price:19800,style:["シンプル","上品","普段使い"],scene:["普段使い","仕事","通勤"],tags:["シンプル","ネックレス","普段使い"]},
 {name:"エレガント パールピアス",type:"ピアス",price:27500,style:["上品","華やか"],scene:["プレゼント","特別な日","仕事"],tags:["上品","パール","プレゼント"]},
 {name:"カジュアル ミニリング",type:"リング",price:9800,style:["カジュアル","シンプル"],scene:["普段使い"],tags:["カジュアル","リング","普段使い"]},
 {name:"クラシック ペンダント",type:"ネックレス",price:32000,style:["上品","存在感"],scene:["特別な日","プレゼント"],tags:["華やか","ネックレス","特別な日"]}
];

function setExample(text){
 document.getElementById("query").value=text;
 searchJewelry();
}

function searchJewelry(){
 const q=document.getElementById("query").value.trim();
 if(!q){alert("探したいジュエリーの条件を入力してください。");return;}
 const a=document.getElementById("analysis");
 const r=document.getElementById("results");
 const at=document.getElementById("analysisText");
 const list=document.getElementById("resultList");
 a.classList.add("show"); r.classList.remove("show");
 at.textContent="AIが入力内容から「用途・デザイン・予算」などの条件を分析しています…";

 setTimeout(()=>{
   const budgetMatch=q.match(/(\d+)\s*(?:万|万円)/);
   const budget=budgetMatch ? Number(budgetMatch[1])*10000 : null;
   const lowBudget=/(1万円|一万円|10000|1万)/.test(q);
   const gift=/(プレゼント|贈り物|ギフト|誕生日)/.test(q);
   const casual=/(カジュアル|普段使い|日常)/.test(q);
   const elegant=/(上品|きれいめ|華やか|特別)/.test(q);
   const simple=/(シンプル|さりげない)/.test(q);
   const necklace=/(ネックレス|ペンダント)/.test(q);
   const ring=/(リング|指輪)/.test(q);
   const earring=/(ピアス|イヤリング)/.test(q);

   let scored=products.map(p=>{
     let score=55;
     if(budget && p.price<=budget) score+=22;
     if(lowBudget && p.price<=12000) score+=15;
     if(gift && p.tags.includes("プレゼント")) score+=12;
     if(casual && (p.tags.includes("カジュアル")||p.tags.includes("普段使い"))) score+=12;
     if(elegant && (p.tags.includes("上品")||p.tags.includes("華やか"))) score+=12;
     if(simple && p.tags.includes("シンプル")) score+=12;
     if(necklace && p.type==="ネックレス") score+=15;
     if(ring && p.type==="リング") score+=15;
     if(earring && p.type==="ピアス") score+=15;
     return {...p,score:Math.min(score,98)};
   }).sort((a,b)=>b.score-a.score);

   let summary=[];
   if(gift) summary.push("プレゼント用途");
   if(casual) summary.push("普段使い・カジュアル");
   if(elegant) summary.push("上品・華やか");
   if(simple) summary.push("シンプル");
   if(necklace) summary.push("ネックレス");
   if(ring) summary.push("リング");
   if(earring) summary.push("ピアス");
   if(budget) summary.push("予算 約"+budget.toLocaleString()+"円");
   if(summary.length===0) summary.push("入力された文章からおすすめ条件を抽出");

   at.innerHTML="<b>AIが理解した条件：</b><br>"+summary.join(" / ");
   list.innerHTML=scored.slice(0,3).map(p=>`
     <div class="result">
       <div class="match">AI MATCH ${p.score}%</div>
       <h3>${p.name}</h3>
       <div class="meta">${p.type} ・ ${p.price.toLocaleString()}円</div>
       ${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}
       <div class="reason"><b>おすすめ理由：</b>入力された条件と商品の特徴を照合し、${p.tags.slice(0,2).join("・")}を重視した結果です。</div>
     </div>`).join("");
   r.classList.add("show");
 },700);
}

function resetSearch(){
 document.getElementById("query").value="";
 document.getElementById("analysis").classList.remove("show");
 document.getElementById("results").classList.remove("show");
}
</script>
</body>
</html>
