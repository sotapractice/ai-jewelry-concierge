<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI JEWELRY CONCIERGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
.header{background:#111;color:white;padding:24px 18px 20px;text-align:center}
.header h1{font-size:20px;letter-spacing:2px;margin:0 0 7px}
.header p{font-size:12px;color:#d7d7d7;margin:0}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h2{font-size:17px;margin:0 0 12px}
.label{font-size:12px;font-weight:700;color:#666;margin:15px 0 8px}
textarea{width:100%;min-height:82px;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:14px;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 12px;font-size:12px}
.chip.active{background:#111;color:white;border-color:#111}
.search{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:15px;margin-top:14px}
.reset{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px;margin-top:9px}
.analysis{display:none}
.analysisbox{background:#111;color:#fff;border-radius:15px;padding:18px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #777;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;border:1px solid #555;border-radius:999px;padding:5px 8px;color:#ddd}
.result-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}
.result-title h2{margin:0}
.count{font-size:11px;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product{border:1px solid #e5e5e5;border-radius:15px;padding:12px;overflow:hidden}
.visual{height:125px;border-radius:11px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px}
.jewel{position:relative;width:74px;height:74px}
.circle{width:50px;height:50px;border:7px solid #c9c9c9;border-radius:50%;position:absolute;left:12px;top:12px}
.diamond{width:46px;height:46px;border:6px solid #c9c9c9;transform:rotate(45deg);position:absolute;left:14px;top:14px;border-radius:5px}
.ring{width:58px;height:58px;border:9px solid #c9c9c9;border-radius:50%;position:absolute;left:8px;top:9px}
.pearl{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd);box-shadow:0 0 0 3px #c9c9c9;position:absolute;left:18px;top:18px}
.bar{width:72px;height:10px;border-radius:8px;background:#c9c9c9;position:absolute;left:1px;top:32px}
.stone{width:36px;height:36px;background:#ddd;transform:rotate(45deg);position:absolute;left:19px;top:19px;border-radius:5px}
.gold{filter:none}.silver{filter:grayscale(1)}.pink{filter:hue-rotate(315deg) saturate(.55)}
.match{position:absolute;right:7px;top:7px;background:#111;color:#fff;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:700}
.product h3{font-size:13px;margin:0 0 5px}
.price{font-weight:700;font-size:14px;margin-bottom:5px}
.meta{font-size:10px;color:#777;margin-bottom:8px}
.reason{font-size:11px;line-height:1.5;color:#555}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.visual{height:112px}}
</style>
</head>
<body>
<div style="background:#fff3cd;color:#664d03;border-bottom:1px solid #ffe69c;padding:9px 14px;text-align:center;font-size:12px;font-weight:700;">
  ⚠️ これはシステム提案用のデモです。商品情報・AI分析結果はサンプルです。
</div>
<header class="header">
<h1>AI JEWELRY CONCIERGE</h1>
<p>AIに相談して、あなたに合うジュエリーを検索</p>
</header>

<main class="wrap">
<section class="card">
<h2>AIに希望を伝える</h2>
<textarea id="text" placeholder="例：普段使いできるシンプルなネックレスが欲しい。ゴールドで2万円くらい"></textarea>

<div class="label">利用シーン</div>
<div class="chips" data-group="scene">
<button class="chip" data-value="普段使い">普段使い</button>
<button class="chip" data-value="仕事・通勤">仕事・通勤</button>
<button class="chip" data-value="プレゼント">プレゼント</button>
<button class="chip" data-value="特別な日">特別な日</button>
</div>

<div class="label">デザイン</div>
<div class="chips" data-group="design">
<button class="chip" data-value="シンプル">シンプル</button>
<button class="chip" data-value="上品">上品・きれいめ</button>
<button class="chip" data-value="カジュアル">カジュアル</button>
<button class="chip" data-value="華やか">華やか</button>
</div>

<div class="label">カラー</div>
<div class="chips" data-group="color">
<button class="chip" data-value="シルバー">シルバー</button>
<button class="chip" data-value="ゴールド">ゴールド</button>
<button class="chip" data-value="ピンクゴールド">ピンクゴールド</button>
<button class="chip" data-value="おまかせ">おまかせ</button>
</div>

<div class="label">種類</div>
<div class="chips" data-group="type">
<button class="chip" data-value="ネックレス">ネックレス</button>
<button class="chip" data-value="リング">リング</button>
<button class="chip" data-value="ピアス">ピアス</button>
<button class="chip" data-value="ブレスレット">ブレスレット</button>
</div>

<div class="label">予算</div>
<div class="chips" data-group="budget">
<button class="chip" data-value="～10000">～1万円</button>
<button class="chip" data-value="10000-30000">1～3万円</button>
<button class="chip" data-value="30000～">3万円～</button>
</div>

<button class="search" onclick="searchAI()">✨ AI検索する</button>
<button class="reset" onclick="resetAll()">条件をリセット</button>
</section>

<section class="card analysis" id="analysis">
<div class="analysisbox">
<div><span class="spinner"></span><b>AIが希望条件を分析しています</b></div>
<div class="tags" id="analysisTags"></div>
<p id="analysisText" style="font-size:12px;line-height:1.7;margin:14px 0 0;color:#ddd"></p>
</div>
</section>

<section class="card" id="results" style="display:none">
<div class="result-title">
<h2>AIおすすめジュエリー</h2>
<span class="count" id="resultCount"></span>
</div>
<div class="grid" id="productGrid"></div>
</section>
</main>

<script>
const products=[
{name:"シンプル ストーンネックレス",type:"ネックレス",color:"シルバー",design:"シンプル",scene:"普段使い",price:19800,shape:"diamond"},
{name:"ゴールド ミニリング",type:"リング",color:"ゴールド",design:"シンプル",scene:"普段使い",price:9800,shape:"ring"},
{name:"エレガント パールピアス",type:"ピアス",color:"シルバー",design:"上品",scene:"仕事・通勤",price:27500,shape:"pearl"},
{name:"ローズラインネックレス",type:"ネックレス",color:"ピンクゴールド",design:"上品",scene:"プレゼント",price:22800,shape:"circle"},
{name:"カジュアル バングル",type:"ブレスレット",color:"シルバー",design:"カジュアル",scene:"普段使い",price:12800,shape:"bar"},
{name:"クラシック ペンダント",type:"ネックレス",color:"ゴールド",design:"華やか",scene:"特別な日",price:32000,shape:"diamond"},
{name:"ミニパールリング",type:"リング",color:"ピンクゴールド",design:"上品",scene:"プレゼント",price:16800,shape:"pearl"},
{name:"スクエア ストーンピアス",type:"ピアス",color:"ゴールド",design:"華やか",scene:"特別な日",price:29800,shape:"stone"}
];

let selections={};
document.querySelectorAll(".chips").forEach(group=>{
 group.addEventListener("click",e=>{
  if(!e.target.classList.contains("chip"))return;
  [...group.querySelectorAll(".chip")].forEach(x=>x.classList.remove("active"));
  e.target.classList.add("active");
  selections[group.dataset.group]=e.target.dataset.value;
 });
});

function getBudget(v,p){
 if(v==="～10000") return p<=10000;
 if(v==="10000-30000") return p>=10000&&p<=30000;
 if(v==="30000～") return p>=30000;
 return true;
}

function searchAI(){
 const text=document.getElementById("text").value;
 const all=(text+" "+Object.values(selections).join(" ")).toLowerCase();
 const tags=[];
 Object.values(selections).forEach(v=>{if(v&&v!=="おまかせ")tags.push(v)});
 ["普段使い","仕事","プレゼント","特別","シンプル","上品","カジュアル","華やか","シルバー","ゴールド","ピンクゴールド","ネックレス","リング","ピアス","ブレスレット"].forEach(k=>{
   if(all.includes(k.toLowerCase())&&!tags.includes(k)) tags.push(k);
 });
 const budget=selections.budget || (text.includes("1万円")?"～10000":text.includes("2万円")||text.includes("3万円")?"10000-30000":null);
 const type=selections.type || ["ネックレス","リング","ピアス","ブレスレット"].find(x=>text.includes(x));
 const color=selections.color || ["ピンクゴールド","ゴールド","シルバー"].find(x=>text.includes(x));
 const design=selections.design || ["シンプル","上品","カジュアル","華やか"].find(x=>text.includes(x));
 const scene=selections.scene || ["普段使い","仕事・通勤","プレゼント","特別な日"].find(x=>text.includes(x));

 const scored=products.map(p=>{
   let score=55;
   if(type===p.type)score+=20;
   if(color&&color!=="おまかせ"&&color===p.color)score+=18;
   if(design===p.design)score+=14;
   if(scene===p.scene)score+=10;
   if(budget&&getBudget(budget,p.price))score+=12;
   return {...p,score:Math.min(99,score)};
 }).sort((a,b)=>b.score-a.score);

 // 指定された条件を優先し、条件から大きく外れる商品は表示しない
 const activeConditions=[type,color&&color!=="おまかせ"?color:null,design,scene,budget].filter(Boolean);
 let filtered=scored.filter(p=>p.score>=75);

 // 厳しい条件で候補が少ない場合は、条件一致度の高い商品を最大3件だけ表示
 if(filtered.length===0){
   filtered=scored.filter(p=>p.score>=65).slice(0,3);
 }
 // 候補が多すぎる場合も、AIが厳選した最大6件にする
 filtered=filtered.slice(0,6);

 const analysis=document.getElementById("analysis");
 const results=document.getElementById("results");
 analysis.style.display="block"; results.style.display="none";
 document.getElementById("analysisTags").innerHTML=(tags.length?tags:["入力内容をAIが解析"]).map(x=>`<span class="tag">${x}</span>`).join("");
 document.getElementById("analysisText").textContent="利用シーン・デザイン・カラー・種類・予算を組み合わせて、商品データから条件に近いジュエリーを検索しています。";

 setTimeout(()=>{
   analysis.style.display="none"; results.style.display="block";
   document.getElementById("resultCount").textContent=filtered.length+"件を表示";
   if(filtered.length===0){
     document.getElementById("productGrid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:28px 12px;color:#666;font-size:13px;line-height:1.8">条件に一致する商品が見つかりませんでした。<br>カラー・種類・予算などの条件を変更すると、候補が広がります。</div>';
   } else {
   document.getElementById("productGrid").innerHTML=filtered.map(p=>`
    <article class="product">
      <div class="visual"><div class="match">${p.score}% MATCH</div><div class="jewel ${p.color==="ゴールド"?"gold":p.color==="ピンクゴールド"?"pink":"silver"}">${shapeHTML(p.shape)}</div></div>
      <h3>${p.name}</h3>
      <div class="price">¥${p.price.toLocaleString()}</div>
      <div class="meta">${p.type} / ${p.color} / ${p.design}</div>
      <div class="reason">AIおすすめ：${reason(p,scene,design,color,type)}</div>
    </article>`).join("");
   }
 },850);
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function shapeHTML(shape){
 const map={diamond:'<div class="diamond"></div>',ring:'<div class="ring"></div>',pearl:'<div class="pearl"></div>',circle:'<div class="circle"></div>',bar:'<div class="bar"></div>',stone:'<div class="stone"></div>'};
 return map[shape];
}
function reason(p,scene,design,color,type){
 let arr=[];
 if(type===p.type)arr.push("希望した種類");
 if(color&&color!=="おまかせ"&&color===p.color)arr.push("希望カラー");
 if(design===p.design)arr.push("デザイン");
 if(scene===p.scene)arr.push("利用シーン");
 return arr.length?arr.join("・")+"との相性が高い商品です。":"入力条件との総合的な相性が高い商品です。";
}
function resetAll(){
 document.getElementById("text").value="";
 selections={};
 document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
 document.getElementById("analysis").style.display="none";
 document.getElementById("results").style.display="none";
}
</script>
</body>
</html>
